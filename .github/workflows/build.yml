name: C++ Build and Crash Simulation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # 使用 Ubuntu 构建环境

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install g++ (for compilation)
      run: sudo apt update && sudo apt install -y g++

    - name: Compile crash simulator
      run: |
        g++ -o crash_simulator crash_simulator.cpp -std=c++11 -pthread
        echo "编译完成！"

    - name: Run crash simulator
      run: |
        ./crash_simulator || true  # 使用 || true 防止崩溃导致 GitHub Actions 失败

    - name: Upload crash simulator output
      uses: actions/upload-artifact@v2
      with:
        name: crash_simulator_output
        path: |
          crash_simulator
          crash_simulator.cpp
