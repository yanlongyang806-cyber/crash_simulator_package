name: Windows Build and Artifact Export

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🏗️ Build C++ project (using MSVC)
      shell: cmd
      run: |
        echo 编译中...
        cl /EHsc main.cpp /Fecrash_simulator.exe
        echo ✅ 编译完成！

    - name: 🚀 Run the program safely
      shell: cmd
      run: |
        echo 运行模拟程序（会触发崩溃测试）
        crash_simulator.exe || exit /b 0
        echo ✅ 执行结束

    - name: 📦 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: crash_simulator_build
        path: |
          crash_simulator.exe
          main.cpp
          README.md
          CMakeLists.txt
