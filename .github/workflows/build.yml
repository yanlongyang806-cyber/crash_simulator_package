name: C++ Build and Test

# 🔸 当 push 或 PR 到任意分支都会触发（不再仅限 master）
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest  # 在 Ubuntu 服务器上构建

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up GCC
      run: |
        sudo apt update
        sudo apt install -y g++

    - name: Build project
      run: |
        echo "📦 开始编译..."
        g++ -o crash_simulator main.cpp -std=c++11
        echo "✅ 编译完成"

    - name: Run the simulator
      run: |
        echo "🚀 启动程序（注意：这会触发崩溃模拟）"
        ./crash_simulator || true
