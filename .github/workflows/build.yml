name: C++ Build and Save Executable

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install GCC
      run: |
        sudo apt update
        sudo apt install -y g++

    - name: Build project
      run: |
        echo "📦 正在编译..."
        g++ -o crash_simulator main.cpp -std=c++11
