name: C++ Build and Artifact Export

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3

    - name: ⚙️ Install GCC
      run: |
        sudo apt update
        sudo apt install -y g++

    - name: 🏗️ Build C++ Project
      run: |
        echo "正在编译程序..."
        g++ -o crash_simulator main.cpp -std=c++11
        echo "✅ 编译成功，开始执行..."

    - name: 🚀 Run program safely
      run: |
        echo "运行模拟程序（会触发崩溃测试）"
        ./crash_simulator || true
        echo "✅ 运行结束"

    - name: 📦 Upload build artifact (可下载产物)
      uses: actions/upload-artifact@v3
      with:
        name: crash_simulator_build
        path: |
          crash_simulator
          main.cpp
          README.md
          CMakeLists.txt
